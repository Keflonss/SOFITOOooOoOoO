<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fuente elegante de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero">
        <h1>Nuestra Historia</h1>
        <p>Un pequeño detalle para alguien muy especial.</p>
    </header>

    <section class="gallery">
        <!-- Foto Polaroid -->
        <div class="polaroid">
            <img src="img/foto1.jpg" alt="Nosotros en el parque">
            <div class="caption">Ese día increíble...</div>
        </div>
        <div class="polaroid">
            <img src="img/foto2.jpg" alt="Nuestra primera cita">
            <div class="caption">Mi recuerdo favorito.</div>
        </div>
    </section>

    <section class="messages">
        <!-- Tarjeta Interactiva (Se voltea al pasar el mouse o tocar) -->
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <h3>Pasa el mouse por aquí 💌</h3>
                </div>
                <div class="flip-card-back">
                    <p>Quería decirte que me encanta pasar tiempo contigo y que me haces muy feliz.</p>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
